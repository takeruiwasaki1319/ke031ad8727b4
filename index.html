<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>撮影企画</title>
<style>
:root{color-scheme:light;--bg:#f6f4ee;--ink:#1d1b16;--sub:#6b665d;--line:#e2ddd1;--acc:#ffd400}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:"PingFang TC","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans TC","Noto Sans JP",sans-serif;line-height:1.85;font-size:16px;letter-spacing:.02em;-webkit-text-size-adjust:100%}
a{color:#1a5fb4;word-break:break-all}
header{background:var(--ink);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:21px;line-height:1.35}
.bar{position:sticky;top:0;z-index:5;background:var(--ink);padding:12px 16px}
.bar a{color:#fff;text-decoration:none;font-weight:700}
main{max-width:720px;margin:0 auto;padding:8px 16px 48px}
h2.sec{font-size:15px;color:var(--sub);margin:30px 0 10px;letter-spacing:.04em}
.card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0;color:inherit;text-decoration:none;font-weight:700;line-height:1.5}
.card span{flex:1}
.row{display:flex;align-items:stretch;gap:8px;margin:10px 0}
.row .card{flex:1;margin:0}
.chk{flex:none;width:52px;border:2px solid var(--line);background:#fff;border-radius:12px;color:transparent;font-size:24px;font-weight:800;font-family:inherit;padding:0}
.row.done .chk{background:#2e7d32;border-color:#2e7d32;color:#fff}
.row.done .card{background:#ecebe6;color:#8a857b}
.prog{margin-top:6px;font-size:14px;color:#cfcac0}
.badge[hidden]{display:none}
.badge{display:inline-block;margin:18px 0 -6px;background:#2e7d32;color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
.donebtn{display:block;width:100%;margin:40px 0 8px;padding:16px;border:2px solid #2e7d32;border-radius:12px;background:#fff;color:#2e7d32;font-size:17px;font-weight:800;font-family:inherit}
.donebtn.on{background:#2e7d32;color:#fff}
.card i{font-style:normal;color:#b5afa3;font-size:24px;line-height:1}
.page h1{font-size:22px;line-height:1.45;margin:20px 0 20px;padding-bottom:12px;border-bottom:3px solid var(--ink)}
.page h3{font-size:18px;line-height:1.5;margin:40px 0 14px;padding-left:10px;border-left:5px solid var(--acc)}
.page h3:first-child{margin-top:8px}
.page h4{font-size:16px;margin:28px 0 8px}
.page p{margin:0 0 14px}
.page ul,.page ol{padding-left:1.3em;margin:0 0 18px}
.page li{margin:0 0 10px;padding-left:2px}
.kv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.kv .k{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.kv .v{font-size:16px}
.line{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.line .lbl{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
.line .ja{font-size:17px;font-weight:700;line-height:1.7}
.line .zh{margin-top:10px;padding:10px 12px;background:#fff8cc;border-radius:8px;font-size:17px;line-height:1.7}
.line .zh::before{content:"中文";display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:2px}
.line .note{margin-top:8px;font-size:13px;color:var(--sub)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 20px}
table{border-collapse:collapse;background:#fff;font-size:15px;line-height:1.7;min-width:100%}
td,th{border:1px solid var(--line);padding:10px 12px;vertical-align:top;min-width:7em}
td:first-child,th:first-child{min-width:2.5em}
th{background:#efebe1;text-align:left}
hr{border:0;border-top:2px dashed var(--line);margin:36px 0}
.doc{margin:0 0 28px}
.docname{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px}
.doc img{display:block;width:100%;height:auto;border:1px solid var(--line);margin-bottom:6px;background:#fff;min-height:120px}
.page img,.page video{max-width:100%;height:auto;display:block;margin:8px 0}
details{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.callout,blockquote{background:#fff;border-left:4px solid var(--acc);padding:8px 12px;margin:8px 0}
.c-red,.c-red_background{color:#c01c28}.c-blue,.c-blue_background{color:#1a5fb4}
#lock{max-width:360px;margin:18vh auto 0;padding:0 24px;text-align:center}
#lock input{width:100%;font-size:18px;padding:12px;border:2px solid var(--ink);border-radius:10px;margin:14px 0 10px;font-family:inherit}
#lock button{width:100%;font-size:17px;padding:12px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-family:inherit}
#err{color:#c01c28;font-size:14px;min-height:1.5em;margin-top:8px}
#off{text-align:center;font-size:12px;color:var(--sub);padding:12px}
</style></head><body>
<div id="app"><form id="lock"><div style="font-weight:700;font-size:18px">パスワード</div>
<input id="pw" type="password" autocomplete="current-password" autofocus>
<button>開く</button><div id="err"></div></form></div>
<div id="off"></div>
<script>
const META={"salt": "RE8LxUahqfLNn6kksvjWsQ==", "iter": 250000};
let KEY=null,DATA=null;const urls={};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(META.salt),iterations:META.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function dec(path){const buf=new Uint8Array(await (await fetch('d/'+path)).arrayBuffer());
  return crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},KEY,buf.slice(12))}
async function unlock(key){KEY=key;DATA=JSON.parse(new TextDecoder().decode(await dec('pages.bin')))}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function getDone(){try{return new Set(JSON.parse(localStorage.getItem('done')||'[]'))}catch(e){return new Set()}}
function toggleDone(t){const d=getDone();d.has(t)?d.delete(t):d.add(t);try{localStorage.setItem('done',JSON.stringify([...d]))}catch(e){}
  if(location.hash.startsWith('#p'))paintPage(d.has(t));else render(true)}
function paintPage(d){const b=document.querySelector('.donebtn'),g=document.querySelector('.badge');
  b.classList.toggle('on',d);b.textContent=d?'✓ 撮影完了（タップで取り消し）':'撮影完了にする';g.hidden=!d}
function render(keep){const app=document.getElementById('app');const m=location.hash.match(/^#p(\d+)$/);const done=getDone();const y0=scrollY;
  if(m){const all=DATA.secs.flatMap(s=>s.pages);const p=all[+m[1]];if(p){document.title=p.title;
    app.innerHTML='<div class="bar"><a href="#">← 一覧</a></div><main class="page"><div class="badge">✓ 撮影完了</div><h1>'+esc(p.title)+'</h1>'+p.html+
      '<button class="donebtn" data-t="'+esc(p.title)+'"></button></main>';
    paintPage(done.has(p.title));bindDone(app);window.scrollTo(0,0);loadMedia(app);return}}
  document.title=DATA.title;let n=0,total=0,cnt=0,h='';
  for(const s of DATA.secs){h+='<h2 class="sec">'+esc(s.name)+'</h2>';for(const p of s.pages){total++;const d=done.has(p.title);if(d)cnt++;
    h+='<div class="row'+(d?' done':'')+'"><button class="chk" data-t="'+esc(p.title)+'" aria-label="撮影完了">✓</button><a class="card" href="#p'+(n++)+'"><span>'+esc(p.title)+'</span><i>›</i></a></div>'}}
  app.innerHTML='<header><h1>'+esc(DATA.title)+'</h1><div class="prog">撮影完了 '+cnt+' / '+total+'</div></header><main>'+h+'</main>';
  bindDone(app);if(keep)window.scrollTo(0,y0);else{const y=sessionStorage.getItem('y');if(y)window.scrollTo(0,+y)}}
function bindDone(root){root.querySelectorAll('[data-t]').forEach(b=>b.onclick=e=>{e.preventDefault();toggleDone(b.dataset.t)})}
async function loadMedia(root){for(const el of root.querySelectorAll('[data-enc]')){const n=el.dataset.enc;
  try{if(!urls[n])urls[n]=URL.createObjectURL(new Blob([await dec(n)],{type:el.dataset.type}));if(!el.isConnected)return;el.src=urls[n]}catch(e){}}}
addEventListener('hashchange',()=>{if(DATA)render()});
addEventListener('scroll',()=>{if(DATA&&!location.hash.startsWith('#p'))try{sessionStorage.setItem('y',scrollY)}catch(e){}});
document.getElementById('lock').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='…';
  try{const k=await derive(document.getElementById('pw').value);await unlock(k);
    try{localStorage.setItem('k',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',k)))))}catch(e){}
    render()}catch(x){err.textContent='パスワードが違います'}};
(async()=>{try{const s=localStorage.getItem('k');if(s){await unlock(await crypto.subtle.importKey('raw',b64(s),'AES-GCM',true,['decrypt']));render()}}catch(e){}})();
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.ready.then(()=>caches.keys()).then(ks=>{if(ks.some(k=>k.startsWith('kikaku-')&&!k.endsWith('-tmp')))document.getElementById('off').textContent='✓ オフラインでも開けます'})}
</script>
</body></html>
